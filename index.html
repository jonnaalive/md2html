<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습 모음</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <style>
        /* Hallmark · genre: editorial · macrostructure: Catalogue index · design-system: design.md · designed-as-app
         * theme: custom (paper oklch(96.5% 0.012 90) · accent oklch(52% 0.15 35) vermilion · Noto Serif KR + Pretendard) */
        :root {
            --color-paper: oklch(96.5% 0.012 90);
            --color-ink: oklch(24% 0.012 60);
            --color-ink-2: oklch(47% 0.014 60);
            --color-rule: oklch(87% 0.012 85);
            --color-accent: oklch(52% 0.15 35);
            --color-focus: oklch(52% 0.15 35);
            --font-display: 'Noto Serif KR', 'Apple SD Gothic Neo', 'Nanum Myeongjo', serif;
            --font-body: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --dur-short: 160ms;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --color-paper: oklch(22% 0.012 60);
                --color-ink: oklch(90% 0.008 90);
                --color-ink-2: oklch(66% 0.012 80);
                --color-rule: oklch(33% 0.012 60);
                --color-accent: oklch(71% 0.13 40);
                --color-focus: oklch(71% 0.13 40);
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-body);
            color: var(--color-ink);
            background: var(--color-paper);
            line-height: 1.6;
        }

        :focus-visible {
            outline: 2px solid var(--color-focus);
            outline-offset: 2px;
        }

        .wrap {
            width: min(680px, calc(100% - 40px));
            margin: 0 auto;
            padding: 88px 0 64px;
        }

        .masthead { margin-bottom: 40px; }
        .kicker {
            margin: 0 0 14px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.14em;
            color: var(--color-accent);
        }
        h1 {
            margin: 0 0 12px;
            font-family: var(--font-display);
            font-size: clamp(34px, 7vw, 46px);
            font-weight: 700;
            font-style: normal;
            line-height: 1.2;
            letter-spacing: -0.01em;
        }
        .lede {
            margin: 0;
            color: var(--color-ink-2);
            font-size: 15px;
        }

        .catalogue {
            border-top: 1px solid var(--color-rule);
        }
        .catalogue a {
            display: flex;
            align-items: baseline;
            gap: 18px;
            padding: 22px 4px;
            color: inherit;
            text-decoration: none;
            border-bottom: 1px solid var(--color-rule);
        }
        .cat-num {
            font-size: 13px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--color-accent);
            min-width: 26px;
        }
        .cat-body { flex: 1; min-width: 0; }
        .cat-title {
            display: block;
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 600;
            font-style: normal;
            line-height: 1.4;
            transition: color var(--dur-short) var(--ease-out);
        }
        .catalogue a:hover .cat-title { color: var(--color-accent); }
        .cat-desc {
            display: block;
            margin-top: 4px;
            color: var(--color-ink-2);
            font-size: 13.5px;
        }
        .cat-arrow {
            align-self: center;
            color: var(--color-ink-2);
            flex-shrink: 0;
        }
        .cat-arrow svg { width: 16px; height: 16px; display: block; }

        .colophon {
            margin-top: 36px;
            color: var(--color-ink-2);
            font-size: 12.5px;
        }

        @media (max-width: 700px) {
            .wrap { padding: 52px 0 48px; }
            .catalogue a { gap: 12px; padding: 18px 2px; }
            .cat-title { font-size: 17px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <header class="masthead">
            <p class="kicker">주식 스터디 아카이브</p>
            <h1>학습 모음</h1>
            <p class="lede">열람할 학습 노트를 선택하세요.</p>
        </header>

        <nav class="catalogue" aria-label="학습 모음 메뉴">
            <a href="2026_%ED%95%99%EC%8A%B5%EB%AA%A8%EC%9D%8C.html">
                <span class="cat-num">01</span>
                <span class="cat-body">
                    <span class="cat-title">2026 상반기 학습 모음</span>
                    <span class="cat-desc">1월부터 6월 말까지의 학습 노트</span>
                </span>
                <span class="cat-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
            </a>
            <a href="2026_%ED%95%98%EB%B0%98%EA%B8%B0_%ED%95%99%EC%8A%B5%EB%AA%A8%EC%9D%8C.html">
                <span class="cat-num">02</span>
                <span class="cat-body">
                    <span class="cat-title">2026 하반기 학습 모음</span>
                    <span class="cat-desc">7월부터 현재까지 이어지는 학습 노트</span>
                </span>
                <span class="cat-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
            </a>
            <a href="https://weekly-input.vercel.app/">
                <span class="cat-num">03</span>
                <span class="cat-body">
                    <span class="cat-title">주기적 인풋 정리</span>
                    <span class="cat-desc">2023~2026년 주차별 인풋 아카이브 (외부 사이트)</span>
                </span>
                <span class="cat-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg></span>
            </a>
        </nav>

        <p class="colophon">옵시디언 노트에서 자동 변환된 학습 아카이브</p>
    </main>
</body>
</html>
