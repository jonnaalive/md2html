<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습 모음</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --text: #1f2937;
            --muted: #6b7280;
            --line: #d8dde5;
            --card: #ffffff;
            --accent: #2563eb;
            --accent-dark: #1d4ed8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background: var(--bg);
        }

        .wrap {
            width: min(920px, calc(100% - 32px));
            margin: 0 auto;
            padding: 72px 0;
        }

        header {
            margin-bottom: 28px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 0;
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.6;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .menu a {
            display: block;
            min-height: 150px;
            padding: 24px;
            color: inherit;
            text-decoration: none;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
        }

        .menu a:hover,
        .menu a:focus-visible {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
            outline: none;
        }

        .label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 28px;
            padding: 0 10px;
            margin-bottom: 18px;
            color: var(--accent-dark);
            background: #eef4ff;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
        }

        .title {
            display: block;
            margin-bottom: 10px;
            font-size: 23px;
            font-weight: 800;
        }

        .desc {
            display: block;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.5;
        }

        @media (max-width: 700px) {
            .wrap {
                width: min(100% - 24px, 920px);
                padding: 36px 0;
            }

            h1 {
                font-size: 28px;
            }

            .menu {
                grid-template-columns: 1fr;
            }

            .menu a {
                min-height: 132px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <header>
            <h1>2026 학습 모음</h1>
            <p>열람할 학습 노트를 선택하세요.</p>
        </header>

        <section class="menu" aria-label="학습 모음 메뉴">
            <a href="2026_%ED%95%99%EC%8A%B5%EB%AA%A8%EC%9D%8C.html">
                <span class="label">상반기</span>
                <span class="title">2026 상반기 학습 모음</span>
                <span class="desc">상반기 학습 노트 페이지로 이동합니다.</span>
            </a>
            <a href="2026_%ED%95%98%EB%B0%98%EA%B8%B0_%ED%95%99%EC%8A%B5%EB%AA%A8%EC%9D%8C.html">
                <span class="label">하반기</span>
                <span class="title">2026 하반기 학습 모음</span>
                <span class="desc">새로 만든 하반기 학습 노트 페이지로 이동합니다.</span>
            </a>
        </section>
    </main>
</body>
</html>
